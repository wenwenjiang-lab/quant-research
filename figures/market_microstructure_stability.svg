<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#596579}.panel{font-size:17px;font-weight:700}.label{font-size:13px}.axis{font-size:12px;fill:#596579}.value{font-size:12px;font-weight:700}.note{font-size:13px;fill:#364152}.callout{font-size:15px;font-weight:700}</style>
<text x="70" y="42" class="title">Study 04 stability diagnosis after failed replication</text>
<text x="70" y="67" class="sub">Post-hoc description only · no refit, model selection, or change to the registered decision</text>
<line x1="70" y1="88" x2="1130" y2="88" stroke="#d9e1ea"/>
<text x="70" y="119" class="panel">A · Measured input drift</text>
<text x="760" y="119" class="panel">B · Leave-one-session-out influence</text>
<text x="70" y="141" class="axis">Population stability index (PSI); descriptive, not a hypothesis test</text>
<text x="70" y="166" class="label">Ask depth, levels 1-5</text>
<rect x="285" y="150" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="150" width="420.00" height="23" rx="2" fill="#167d6d"/>
<text x="713.00" y="166" class="value">0.336</text>
<text x="70" y="209" class="label">Ask depth, levels 1-10</text>
<rect x="285" y="193" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="193" width="403.61" height="23" rx="2" fill="#167d6d"/>
<text x="696.61" y="209" class="value">0.323</text>
<text x="70" y="252" class="label">Bid depth, levels 1-5</text>
<rect x="285" y="236" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="236" width="387.53" height="23" rx="2" fill="#167d6d"/>
<text x="680.53" y="252" class="value">0.310</text>
<text x="70" y="295" class="label">Bid depth, levels 1-10</text>
<rect x="285" y="279" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="279" width="379.94" height="23" rx="2" fill="#167d6d"/>
<text x="672.94" y="295" class="value">0.304</text>
<text x="70" y="338" class="label">Recent volatility (1 s)</text>
<rect x="285" y="322" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="322" width="48.71" height="23" rx="2" fill="#9ab0c3"/>
<text x="341.71" y="338" class="value">0.039</text>
<text x="70" y="381" class="label">Imbalance, levels 1-5</text>
<rect x="285" y="365" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="365" width="45.17" height="23" rx="2" fill="#9ab0c3"/>
<text x="338.17" y="381" class="value">0.036</text>
<text x="70" y="424" class="label">Spread (ticks)</text>
<rect x="285" y="408" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="408" width="37.92" height="23" rx="2" fill="#9ab0c3"/>
<text x="330.92" y="424" class="value">0.030</text>
<text x="70" y="467" class="label">Events per 100 ms</text>
<rect x="285" y="451" width="420" height="23" rx="2" fill="#eef2f6"/>
<rect x="285" y="451" width="29.32" height="23" rx="2" fill="#9ab0c3"/>
<text x="322.32" y="467" class="value">0.023</text>
<text x="760" y="151" class="sub">Log-loss delta: multi-level candidate minus top-of-book baseline</text>
<text x="760" y="174" class="sub">Negative values favor the candidate; the preregistered threshold was -0.001.</text>
<line x1="780" y1="280" x2="1110" y2="280" stroke="#8795a8" stroke-width="2"/>
<line x1="807.50" y1="220" x2="807.50" y2="340" stroke="#c65d35" stroke-width="2" stroke-dasharray="5 4"/>
<text x="807.50" y="210" text-anchor="middle" class="axis">threshold -0.001</text>
<line x1="1082.50" y1="240" x2="1082.50" y2="320" stroke="#cbd5e1"/>
<line x1="1002.31" y1="280" x2="1036.36" y2="280" stroke="#167d6d" stroke-width="10" stroke-linecap="round"/>
<circle cx="1021.50" cy="280" r="8" fill="#172033"/>
<text x="1021.50" y="262" text-anchor="middle" class="value">mean -0.000222</text>
<text x="1019.34" y="314" text-anchor="middle" class="axis">leave-one-out range [-0.000292, -0.000168]</text>
<rect x="760" y="375" width="370" height="106" rx="7" fill="#f4f7fa" stroke="#d9e1ea"/>
<text x="785" y="408" class="callout">No single session explains the failure.</text>
<text x="785" y="434" class="note">All 19 leave-one-out estimates remained slightly favorable,</text>
<text x="785" y="456" class="note">but every estimate remained far short of the threshold.</text>
<line x1="70" y1="530" x2="1130" y2="530" stroke="#d9e1ea"/>
<text x="70" y="565" class="callout">Interpretation</text>
<text x="70" y="591" class="note">Displayed-depth distributions shifted between Development and July. This is an observable association, not a causal explanation.</text>
<text x="70" y="616" class="note">The registered outcome remains failed replication; these diagnostics do not validate Alpha or justify model tuning.</text>
</svg>
